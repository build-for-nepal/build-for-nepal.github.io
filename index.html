<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0E8D8B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Build for Nepal</title>
    <link rel="canonical" href="https://build-for-nepal.github.io/" />
    <meta
      name="description"
      content="Open-source tools built for Nepal. Date converters, interactive maps, trail guides, and more by the Build for Nepal community."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Build for Nepal" />
    <meta property="og:title" content="Build for Nepal" />
    <meta
      property="og:description"
      content="Open-source tools built for Nepal. Date converters, interactive maps, trail guides, and more by the Build for Nepal community."
    />
    <meta property="og:url" content="https://build-for-nepal.github.io/" />
    <meta
      property="og:image"
      content="https://build-for-nepal.github.io/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Build for Nepal" />
    <meta
      name="twitter:description"
      content="Open-source tools built for Nepal. Date converters, interactive maps, trail guides, and more by the Build for Nepal community."
    />
    <meta
      name="twitter:image"
      content="https://build-for-nepal.github.io/og-image.png"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Build for Nepal",
        "url": "https://build-for-nepal.github.io/",
        "logo": "https://build-for-nepal.github.io/og-image.png",
        "description": "An open-source community building free tools for Nepal: date converters, interactive maps, trail guides, and more.",
        "sameAs": ["https://github.com/build-for-nepal"]
      }
    </script>
    <script>
      // Companion to public/404.html, decodes the path encoded by the GH Pages
      // SPA fallback and replaces the history entry so React Router sees the
      // correct URL from the start.
      (function () {
        var p = new URLSearchParams(window.location.search).get("p");
        if (p) window.history.replaceState(null, "", decodeURIComponent(p));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
