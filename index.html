    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0E8D8B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Build for Nepal</title>
    <meta
      name="description"

    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Build for Nepal" />

      property="og:description"

      name="twitter:description"
      content="Open-source tools built for Nepal. Date converters, interactive maps, trail guides, and more by the Build for Nepal community."
    />
    <script>
      // Companion to public/404.html, decodes the path encoded by the GH Pages
      // SPA fallback and replaces the history entry so React Router sees the
      // correct URL from the start.
      (function () {
        var p = new URLSearchParams(window.location.search).get("p");
        if (p) window.history.replaceState(null, "", decodeURIComponent(p));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
