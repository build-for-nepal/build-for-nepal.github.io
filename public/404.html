<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA fallback.
      // Encodes the current path into the query string, then redirects to
      // index.html, which React Router picks up and routes correctly.
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1).join("/") +
        "/?p=" + encodeURIComponent(l.pathname + l.search) +
        "&q=" + l.hash.slice(1)
      );
    </script>
  </head>
  <body></body>
</html>
